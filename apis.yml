aid: sprypoint
name: SpryPoint
description: >-
  SpryPoint is a cloud-based customer service and operations software provider
  for utilities, founded in 2012 and headquartered in Charlottetown, Prince
  Edward Island, Canada. Its platform modernizes the meter-to-cash lifecycle for
  water & sewer, electric, and gas utilities across North America through an
  integrated suite of modules: SpryCIS (customer information system), SpryEngage
  (omnichannel customer portal), SpryWallet (payment processing), SpryMobile MFS
  (field service orders), SpryMobile WOAM (work order and asset management),
  SpryBackflow (backflow compliance), and SpryIDM (interval data management).
  The company serves 100+ utility clients, employs 285+ people, is SOC 2 audited,
  and is backed by Norwest Venture Partners and Insight Partners. SpryPoint
  publishes no public developer portal or API documentation; integrations are
  delivered through partnership engagements rather than a self-service API.
